name: Continuous Integration (CI)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Run Library Unit Tests
        run: ./gradlew :simplefetch:test

      - name: Run Sample App Tests (Optional)
        run: ./gradlew :app:test --continue || echo "Sample app tests finished with warnings; continuing CI."
        continue-on-error: true

      - name: Assemble Debug APK & Library AAR
        run: ./gradlew assembleDebug :simplefetch:assemble
